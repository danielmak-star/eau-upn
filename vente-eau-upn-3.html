<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a6b3c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Vente d'Eau UPN</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f0e8; --card: #fffdf7; --border: #ddd5c0;
      --text: #1a1208; --muted: #8a7a60;
      --accent: #1a6b3c; --accent-light: #e8f5ee;
      --danger: #b83232; --danger-light: #fdf0f0;
      --gold: #c9881a; --gold-light: #fdf6e8;
      --blue: #1a5a8a; --blue-light: #e8f0f8;
      --font: Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    .header { background: var(--accent); padding: 16px 20px 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .header-sub { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.55); text-transform: uppercase; margin-bottom: 2px; }
    .header-title { font-size: 20px; font-weight: 700; color: #fff; }
    .badge-danger { background: rgba(255,80,80,0.2); border: 1px solid rgba(255,100,100,0.4); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #ffd0d0; }
    .badge-muted { color: rgba(255,255,255,0.4); font-size: 12px; }
    .tabs { background: var(--card); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; }
    .tab-btn { flex: 1; padding: 12px 4px; background: none; border: none; border-bottom: 3px solid transparent; color: var(--muted); font-size: 11px; font-family: var(--font); cursor: pointer; white-space: nowrap; min-width: 0; }
    .tab-btn.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 700; }
    .content { padding: 16px 14px 60px; max-width: 700px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .card-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 9px; margin-bottom: 12px; }
    .kpi-grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-bottom: 12px; }
    .kpi { border-radius: 10px; padding: 12px 11px; border: 1px solid var(--border); }
    .kpi-val { font-size: 14px; font-weight: 700; margin-top: 4px; line-height: 1.3; }
    .chart-wrap { position: relative; height: 180px; margin-top: 8px; }
    .chart-wrap-sm { position: relative; height: 140px; margin-top: 8px; }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .btn { border: none; border-radius: 10px; padding: 13px 20px; font-size: 14px; font-weight: 700; font-family: var(--font); cursor: pointer; width: 100%; margin-bottom: 10px; transition: opacity 0.15s; }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    .btn-gold { background: var(--gold-light); border: 1px solid var(--gold); color: var(--gold); }
    .btn-green { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); }
    .btn-sm { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); padding: 5px 11px; font-size: 12px; font-family: var(--font); cursor: pointer; width: auto; margin-bottom: 0; }
    .form-label { display: block; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .form-input { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; color: var(--text); font-size: 15px; font-family: var(--font); width: 100%; outline: none; -webkit-appearance: none; margin-bottom: 12px; }
    .form-input:focus { border-color: var(--accent); }
    textarea.form-input { resize: none; line-height: 1.7; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .alert-box { background: var(--danger-light); border: 1px solid rgba(184,50,50,0.2); border-radius: 10px; padding: 13px 15px; margin-bottom: 12px; }
    .alert-title { font-size: 11px; letter-spacing: 2px; color: var(--danger); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
    .alert-item { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(184,50,50,0.1); }
    .alert-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .flag { font-size: 12px; color: var(--danger); margin-left: 4px; margin-top: 2px; }
    .history-item { border-radius: 10px; padding: 13px 15px; margin-bottom: 10px; border: 1px solid var(--border); background: var(--card); }
    .history-item.flagged { background: var(--danger-light); border-color: rgba(184,50,50,0.3); }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .history-date { font-size: 14px; font-weight: 700; }
    .excuse-tag { font-size: 11px; color: var(--gold); margin-left: 8px; font-weight: 400; }
    .history-stats { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 5px; }
    .stat { font-size: 13px; }
    .stat span { color: var(--muted); }
    .note-text { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 5px; }
    .error-box { color: var(--danger); font-size: 13px; margin-bottom: 10px; padding: 10px 13px; background: var(--danger-light); border-radius: 8px; border: 1px solid rgba(184,50,50,0.2); }
    .success-box { color: var(--accent); font-size: 13px; margin-bottom: 10px; padding: 10px 13px; background: var(--accent-light); border-radius: 8px; border: 1px solid rgba(26,107,60,0.2); }
    .info-box { background: var(--accent-light); border: 1px solid rgba(26,107,60,0.2); border-radius: 10px; padding: 13px 15px; margin-bottom: 12px; font-size: 13px; line-height: 1.6; }
    .section-title { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; font-weight: 700; }
    .divider { height: 1px; background: var(--border); margin: 14px 0; }
    .week-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .week-table th { text-align: left; padding: 7px 8px; color: var(--muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--border); font-weight: 600; }
    .week-table td { padding: 8px 8px; border-bottom: 1px solid var(--border); }
    .week-table tr:last-child td { border-bottom: none; }
    input[type="file"] { font-size: 13px; color: var(--text); width: 100%; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-sub">Forage — DRC</div>
      <div class="header-title">💧 Vente d'Eau UPN</div>
    </div>
    <div id="header-right"></div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('dashboard')">📊 Tableau</button>
  <button class="tab-btn" onclick="showTab('weekly')">📅 Semaines</button>
  <button class="tab-btn" onclick="showTab('add')">＋ Ajouter</button>
  <button class="tab-btn" onclick="showTab('history')">📋 Historique</button>
  <button class="tab-btn" onclick="showTab('settings')">⚙️ Paramètres</button>
  <button class="tab-btn" onclick="showTab('backup')">💾 Sauvegarde</button>
</div>

<div class="content" id="main-content"></div>

<script>
// ── STORAGE ───────────────────────────────────────────────
const KEY_DATA     = "eau-upn-reports-v1";
const KEY_SETTINGS = "eau-upn-settings-v1";

function loadReports() { try { return JSON.parse(localStorage.getItem(KEY_DATA)||"[]"); } catch { return []; } }
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(KEY_SETTINGS)||"{}"); }
  catch { return {}; }
}
function saveReports(d) { try { localStorage.setItem(KEY_DATA, JSON.stringify(d)); return true; } catch { return false; } }
function saveSettings(s) { try { localStorage.setItem(KEY_SETTINGS, JSON.stringify(s)); return true; } catch { return false; } }

// ── STATE ─────────────────────────────────────────────────
let reports  = loadReports();
let settings = Object.assign({ pricePerJerry: 200, jerryLitres: 25, usdRate: 0 }, loadSettings());
let chartRev = null, chartDow = null;

// ── HELPERS ───────────────────────────────────────────────
const fmtFC  = n => n == null ? "—" : Number(n).toLocaleString("fr-FR") + " FC";
const fmtL   = n => n == null ? "—" : Number(n).toLocaleString("fr-FR") + " L";
const fmtUSD = n => n == null || n === 0 ? "—" : "$" + n.toFixed(2);
const today  = () => new Date().toISOString().slice(0,10);
const DAYS   = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];

function litres(fc) {
  if (!fc || !settings.pricePerJerry || !settings.jerryLitres) return null;
  return Math.round((fc / settings.pricePerJerry) * settings.jerryLitres);
}
function toUSD(fc) {
  if (!fc || !settings.usdRate) return null;
  return fc / settings.usdRate;
}

// ── DATE PARSING ──────────────────────────────────────────
function parseDate(text) {
  const s = text.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (s) { const y = s[3].length===2?"20"+s[3]:s[3]; return `${y}-${s[2].padStart(2,"0")}-${s[1].padStart(2,"0")}`; }
  const d = text.match(/(\d{1,2})-(\d{1,2})-(\d{4})/);
  if (d) return `${d[3]}-${d[2].padStart(2,"0")}-${d[1].padStart(2,"0")}`;
  const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,
    janvier:1,"février":2,mars:3,avril:4,mai:5,juin:6,juillet:7,"août":8,septembre:9,octobre:10,novembre:11,"décembre":12};
  const m = text.toLowerCase().match(/(\d{1,2})(?:st|nd|rd|th)?\s+([a-zéûôàè]{3,})/);
  if (m) { const mon=months[m[2].slice(0,3)]||months[m[2]]; if(mon) return `${new Date().getFullYear()}-${String(mon).padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return null;
}

// ── MESSAGE PARSER ────────────────────────────────────────
function parseMessage(text) {
  const amounts = [];
  const re = /([\d][\d\s\u00a0.]*)\s*(?:FC|CDF)/gi;
  let m;
  while ((m=re.exec(text))!==null) {
    const v = parseInt(m[1].replace(/[\s\u00a0.]/g,""));
    if (!isNaN(v) && v>100) amounts.push(v);
  }
  const lre = /(?:montant|total|vendu\s+pour|ventes?|recette)\s*[:\-]?\s*([\d][\d\s\u00a0.]*)/gi;
  while ((m=lre.exec(text))!==null) {
    const v = parseInt(m[1].replace(/[\s\u00a0.]/g,""));
    if (!isNaN(v) && v>100 && !amounts.includes(v)) amounts.push(v);
  }
  const total = amounts.length ? Math.max(...amounts) : null;
  const excuseWords = ["désolé","excuse","pardon","transport","déplacement","retard","absent","impossible","ne peux","pu pas","occupé"];
  const has_excuse = excuseWords.some(w => text.toLowerCase().includes(w));
  return { total, has_excuse };
}

// ── WEEKLY GROUPING ───────────────────────────────────────
function getWeekKey(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay();
  const monday = new Date(d);
  monday.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return monday.toISOString().slice(0,10);
}

function groupByWeek(reps) {
  const weeks = {};
  reps.forEach(r => {
    if (!r.date || !r.total) return;
    const wk = getWeekKey(r.date);
    if (!weeks[wk]) weeks[wk] = { weekStart: wk, total: 0, days: 0, litresTotal: 0 };
    weeks[wk].total += r.total;
    weeks[wk].days += 1;
    weeks[wk].litresTotal += litres(r.total) || 0;
  });
  return Object.values(weeks).sort((a,b) => a.weekStart.localeCompare(b.weekStart));
}

// ── ANOMALY DETECTION ─────────────────────────────────────
function detectAnomalies(reps) {
  if (reps.length < 4) return {};
  const flags = {};
  const totals = reps.filter(r=>r.total!=null).map(r=>r.total);
  const mean = totals.reduce((a,b)=>a+b,0)/totals.length;
  const std = Math.sqrt(totals.map(x=>(x-mean)**2).reduce((a,b)=>a+b,0)/totals.length);
  reps.forEach(r => {
    const f = [];
    if (r.total < mean-1.8*std) f.push("📉 Ventes nettement en dessous de la moyenne");
    if (r.total > mean+1.8*std) f.push("📈 Pic inhabituel — ventes très élevées");
    if (r.has_excuse) f.push("💬 Message contient une excuse ou justification");
    if (f.length) flags[r.id] = f;
  });
  return flags;
}

// ── CHARTS ────────────────────────────────────────────────
function destroyCharts() {
  if (chartRev) { chartRev.destroy(); chartRev=null; }
  if (chartDow) { chartDow.destroy(); chartDow=null; }
}
function buildCharts() {
  const last30 = reports.slice(-30);
  const c1 = document.getElementById("chartRevenue");
  if (c1 && last30.length) {
    chartRev = new Chart(c1, {
      type:"line",
      data:{ labels:last30.map(r=>r.date.slice(5)),
        datasets:[{label:"Ventes FC",data:last30.map(r=>r.total),borderColor:"#1a6b3c",backgroundColor:"rgba(26,107,60,0.1)",borderWidth:2,pointRadius:3,fill:true,tension:0.3}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{color:"#ddd5c0"},ticks:{font:{size:10},maxRotation:45}},
                y:{grid:{color:"#ddd5c0"},ticks:{font:{size:10},callback:v=>`${(v/1000).toFixed(0)}k`}}}}
    });
  }
  const dowMap = {};
  reports.forEach(r=>{ if(!r.total||!r.date) return; const d=new Date(r.date).getDay(); dowMap[d]=dowMap[d]||[]; dowMap[d].push(r.total); });
  const c2 = document.getElementById("chartDow");
  if (c2) {
    chartDow = new Chart(c2, {
      type:"bar",
      data:{ labels:DAYS,
        datasets:[{label:"Moy FC",data:DAYS.map((_,i)=>dowMap[i]?Math.round(dowMap[i].reduce((a,b)=>a+b,0)/dowMap[i].length):0),backgroundColor:"#c9881a",borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false},ticks:{font:{size:11}}},
                y:{grid:{color:"#ddd5c0"},ticks:{font:{size:10},callback:v=>`${(v/1000).toFixed(0)}k`}}}}
    });
  }
}

// ── TAB SWITCHING ─────────────────────────────────────────
function showTab(name) {
  destroyCharts();
  document.querySelectorAll(".tab-btn").forEach((b,i)=>{
    b.classList.toggle("active",["dashboard","weekly","add","history","settings","backup"][i]===name);
  });
  const el = document.getElementById("main-content");
  ({dashboard:renderDashboard,weekly:renderWeekly,add:renderAdd,history:renderHistory,settings:renderSettings,backup:renderBackup})[name](el);
}

// ── DASHBOARD ─────────────────────────────────────────────
function renderDashboard(el) {
  const anomalies = detectAnomalies(reports);
  const flagCount = Object.keys(anomalies).length;
  document.getElementById("header-right").innerHTML = flagCount>0
    ? `<span class="badge-danger">${flagCount} alerte${flagCount>1?"s":""}</span>`
    : `<span class="badge-muted">${reports.length} rapports</span>`;

  if (!reports.length) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">💧</div><div class="empty-title">Aucun rapport encore</div><p style="margin-bottom:20px;font-size:14px">Ajoutez votre premier message WhatsApp</p><button class="btn btn-primary" style="width:auto;padding:12px 24px" onclick="showTab('add')">Ajouter un rapport</button></div>`;
    return;
  }

  const totalFC  = reports.reduce((s,r)=>s+(r.total||0),0);
  const totalL   = reports.reduce((s,r)=>s+(litres(r.total)||0),0);
  const totalUSD = toUSD(totalFC);
  const withT    = reports.filter(r=>r.total!=null);
  const avgFC    = withT.length ? Math.round(withT.reduce((s,r)=>s+r.total,0)/withT.length) : 0;
  const best     = reports.reduce((b,r)=>r.total>(b?.total||0)?r:b,null);

  // Weekly avg
  const weeks = groupByWeek(reports);
  const avgWeekFC = weeks.length ? Math.round(weeks.reduce((s,w)=>s+w.total,0)/weeks.length) : 0;
  const avgWeekL  = weeks.length ? Math.round(weeks.reduce((s,w)=>s+w.litresTotal,0)/weeks.length) : 0;

  let alertHTML = "";
  if (flagCount > 0) {
    const items = Object.entries(anomalies).map(([id,flags])=>{
      const r=reports.find(x=>x.id===id);
      return `<div class="alert-item"><div style="font-size:13px;font-weight:700;margin-bottom:3px">${r?.date} — ${fmtFC(r?.total)}</div>${flags.map(f=>`<div class="flag">${f}</div>`).join("")}</div>`;
    }).join("");
    alertHTML=`<div class="alert-box"><div class="alert-title">🚨 Alertes & Anomalies</div>${items}</div>`;
  }

  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi" style="background:var(--accent-light)">
        <div class="card-label">Revenu total</div>
        <div class="kpi-val" style="color:var(--accent)">${fmtFC(totalFC)}</div>
        ${totalUSD?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtUSD(totalUSD)}</div>`:""}
      </div>
      <div class="kpi" style="background:var(--blue-light)">
        <div class="card-label">Total litres vendus</div>
        <div class="kpi-val" style="color:var(--blue)">${fmtL(totalL)}</div>
      </div>
      <div class="kpi" style="background:var(--gold-light)">
        <div class="card-label">Moyenne / jour</div>
        <div class="kpi-val" style="color:var(--gold)">${fmtFC(avgFC)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtL(litres(avgFC))}</div>
      </div>
      <div class="kpi" style="background:var(--card)">
        <div class="card-label">Meilleur jour</div>
        <div class="kpi-val" style="font-size:13px">${fmtFC(best?.total)}<br><span style="font-size:10px;color:var(--muted);font-weight:400">${best?.date||""}</span></div>
      </div>
    </div>

    <div class="card" style="background:var(--gold-light);border-color:var(--gold)">
      <div class="card-label" style="color:var(--gold)">Moyenne hebdomadaire (${weeks.length} semaine${weeks.length>1?"s":""})</div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:4px">
        <div><div style="font-size:18px;font-weight:700;color:var(--gold)">${fmtFC(avgWeekFC)}</div><div style="font-size:11px;color:var(--muted)">par semaine</div></div>
        <div><div style="font-size:18px;font-weight:700;color:var(--blue)">${fmtL(avgWeekL)}</div><div style="font-size:11px;color:var(--muted)">litres/semaine</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Ventes journalières (FC)</div>
      <div class="chart-wrap"><canvas id="chartRevenue"></canvas></div>
    </div>
    <div class="card">
      <div class="card-label">Moyenne par jour de la semaine</div>
      <div class="chart-wrap-sm"><canvas id="chartDow"></canvas></div>
    </div>
    ${alertHTML}
  `;
  setTimeout(buildCharts,50);
}

// ── WEEKLY ────────────────────────────────────────────────
function renderWeekly(el) {
  if (!reports.length) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">Aucune donnée</div></div>`;
    return;
  }
  const weeks = groupByWeek(reports).reverse();
  const avgWeekFC = weeks.length ? Math.round(weeks.reduce((s,w)=>s+w.total,0)/weeks.length) : 0;

  const rows = weeks.map(w => {
    const usd = toUSD(w.total);
    const flag = w.total < avgWeekFC*0.7 ? "📉" : w.total > avgWeekFC*1.3 ? "📈" : "";
    return `<tr>
      <td style="font-weight:700">${w.weekStart}</td>
      <td>${w.days}j</td>
      <td style="color:var(--accent);font-weight:700">${fmtFC(w.total)}</td>
      <td style="color:var(--blue)">${fmtL(w.litresTotal)}</td>
      <td style="color:var(--muted)">${usd?fmtUSD(usd):""}</td>
      <td>${flag}</td>
    </tr>`;
  }).join("");

  el.innerHTML = `
    <div class="card" style="background:var(--gold-light);border-color:var(--gold);margin-bottom:12px">
      <div class="card-label" style="color:var(--gold)">Moyenne hebdomadaire</div>
      <div style="font-size:20px;font-weight:700;color:var(--gold)">${fmtFC(avgWeekFC)}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px">${fmtL(litres(avgWeekFC)*7)} estimé / semaine</div>
    </div>
    <div class="card" style="overflow-x:auto">
      <div class="section-title">Toutes les semaines</div>
      <table class="week-table">
        <thead><tr>
          <th>Semaine</th><th>Jours</th><th>Total FC</th><th>Litres</th><th>USD</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// ── ADD REPORT ────────────────────────────────────────────
function renderAdd(el) {
  el.innerHTML = `
    <div class="card">
      <div class="section-title">Nouvelle entrée</div>
      <label class="form-label">Date (optionnel — détectée automatiquement)</label>
      <input type="date" id="inp-date" class="form-input" />
      <label class="form-label">Message WhatsApp</label>
      <textarea id="inp-msg" class="form-input" rows="8"
        placeholder="Collez le message ici...&#10;&#10;Ex: 27/05/2026. Montant: 92 000 FC.&#10;Ex: Boss, il a vendu 85 000 FC aujourd'hui."></textarea>
      <div id="add-feedback"></div>
      <button class="btn btn-primary" onclick="doSave()">💾 Enregistrer</button>
      <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px">Fonctionne hors ligne — pas besoin d'internet</p>
    </div>
  `;
}

function doSave() {
  const msg = document.getElementById("inp-msg").value.trim();
  const dateVal = document.getElementById("inp-date").value;
  const fb = document.getElementById("add-feedback");
  if (!msg) return;
  const { total, has_excuse } = parseMessage(msg);
  if (total==null) {
    fb.innerHTML=`<div class="error-box">⚠️ Aucun montant trouvé. Assurez-vous que le message contient un nombre suivi de "FC" (ex: 92 000 FC).</div>`;
    return;
  }
  const date = dateVal || parseDate(msg) || today();
  const existing = reports.findIndex(r=>r.date===date);
  const entry = { id: existing>=0?reports[existing].id:Date.now().toString(), date, total, has_excuse, notes:"", raw:msg };
  if (existing>=0) reports[existing]=entry; else reports.push(entry);
  reports.sort((a,b)=>a.date.localeCompare(b.date));
  if (!saveReports(reports)) {
    fb.innerHTML=`<div class="error-box">❌ Erreur de sauvegarde.</div>`; return;
  }
  const l = litres(total);
  const u = toUSD(total);
  fb.innerHTML=`<div class="success-box">✅ ${fmtFC(total)} — ${fmtL(l)}${u?" — "+fmtUSD(u):""} enregistré pour le ${date}</div>`;
  document.getElementById("inp-msg").value="";
  document.getElementById("inp-date").value="";
  setTimeout(()=>showTab("dashboard"),1400);
}

// ── HISTORY ───────────────────────────────────────────────
function renderHistory(el) {
  if (!reports.length) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Aucun rapport</div></div>`; return;
  }
  const anomalies = detectAnomalies(reports);
  el.innerHTML=[...reports].reverse().map(r=>{
    const flagged=!!anomalies[r.id];
    const l=litres(r.total); const u=toUSD(r.total);
    return `<div class="history-item ${flagged?"flagged":""}">
      <div class="history-header">
        <div><span class="history-date">${r.date}</span>${r.has_excuse?`<span class="excuse-tag">💬 excuse</span>`:""}</div>
        <button class="btn-sm" onclick="deleteReport('${r.id}')">✕</button>
      </div>
      <div class="history-stats">
        <div class="stat"><span>FC: </span><strong style="color:var(--accent)">${fmtFC(r.total)}</strong></div>
        <div class="stat"><span>Litres: </span><strong style="color:var(--blue)">${fmtL(l)}</strong></div>
        ${u?`<div class="stat"><span>USD: </span><strong style="color:var(--gold)">${fmtUSD(u)}</strong></div>`:""}
      </div>
      ${flagged?anomalies[r.id].map(f=>`<div class="flag">${f}</div>`).join(""):""}
    </div>`;
  }).join("");
}

function deleteReport(id) {
  if (!confirm("Supprimer ce rapport ?")) return;
  reports=reports.filter(r=>r.id!==id);
  saveReports(reports);
  showTab("history");
}

// ── SETTINGS ──────────────────────────────────────────────
function renderSettings(el) {
  el.innerHTML=`
    <div class="card">
      <div class="section-title">Prix & conversions</div>
      <div class="row-2">
        <div>
          <label class="form-label">Prix par jerrycan (FC)</label>
          <input type="number" id="s-price" class="form-input" value="${settings.pricePerJerry}" placeholder="200" />
        </div>
        <div>
          <label class="form-label">Litres par jerrycan</label>
          <input type="number" id="s-litres" class="form-input" value="${settings.jerryLitres}" placeholder="25" />
        </div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">
        Par défaut: 1 jerrycan de 25L = 200 FC<br>
        Exemple: 92 000 FC ÷ 200 × 25 = <strong>${Math.round(92000/settings.pricePerJerry*settings.jerryLitres).toLocaleString("fr-FR")} litres</strong>
      </p>
      <div class="divider"></div>
      <label class="form-label">Taux de change (1 USD = ? FC)</label>
      <input type="number" id="s-rate" class="form-input" value="${settings.usdRate||""}" placeholder="Ex: 2800" />
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">
        Laissez vide pour désactiver la conversion USD.<br>
        ${settings.usdRate?`Actuellement: 1 USD = ${settings.usdRate.toLocaleString("fr-FR")} FC`:"Conversion USD désactivée"}
      </p>
      <div id="settings-feedback"></div>
      <button class="btn btn-primary" onclick="doSaveSettings()">✅ Enregistrer les paramètres</button>
    </div>
  `;
}

function doSaveSettings() {
  const price  = parseFloat(document.getElementById("s-price").value);
  const litresV= parseFloat(document.getElementById("s-litres").value);
  const rate   = parseFloat(document.getElementById("s-rate").value)||0;
  if (!price||!litresV) {
    document.getElementById("settings-feedback").innerHTML=`<div class="error-box">Veuillez entrer des valeurs valides.</div>`; return;
  }
  settings = { pricePerJerry:price, jerryLitres:litresV, usdRate:rate };
  saveSettings(settings);
  document.getElementById("settings-feedback").innerHTML=`<div class="success-box">✅ Paramètres enregistrés.</div>`;
  setTimeout(()=>showTab("dashboard"),1000);
}

// ── BACKUP ────────────────────────────────────────────────
function renderBackup(el) {
  el.innerHTML=`
    <div class="info-box">
      <strong>💡 Données sauvegardées sur votre appareil.</strong> Exportez régulièrement pour avoir une copie de secours sur Google Drive ou WhatsApp.
    </div>
    <div class="card">
      <div class="section-title">Exporter (${reports.length} rapport${reports.length!==1?"s":""})</div>
      <button class="btn btn-gold" onclick="exportCSV()" ${!reports.length?"disabled":""}>⬇️ Télécharger CSV (Excel / Sheets)</button>
      <button class="btn btn-green" onclick="exportJSON()" ${!reports.length?"disabled":""}>⬇️ Télécharger JSON (sauvegarde complète)</button>
    </div>
    <div class="divider"></div>
    <div class="card">
      <div class="section-title">Restaurer une sauvegarde</div>
      <p style="font-size:13px;color:var(--text);margin-bottom:12px;line-height:1.6">Les nouvelles entrées seront fusionnées sans supprimer les données existantes.</p>
      <div id="import-feedback"></div>
      <label class="form-label">Importer CSV :</label>
      <input type="file" accept=".csv" onchange="importCSV(event)" />
      <label class="form-label">Importer JSON :</label>
      <input type="file" accept=".json" onchange="importJSON(event)" />
    </div>
  `;
}

function exportCSV() {
  const header="date,total_FC,litres,usd,excuse";
  const rows=reports.map(r=>`${r.date},${r.total??""}, ${litres(r.total)??""}, ${toUSD(r.total)?.toFixed(2)??""},${r.has_excuse?"oui":"non"}`);
  dl("vente-eau-upn-"+today()+".csv",[header,...rows].join("\n"),"text/csv");
}
function exportJSON() { dl("vente-eau-upn-"+today()+".json",JSON.stringify(reports,null,2),"application/json"); }

function importCSV(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const lines=ev.target.result.trim().split("\n").slice(1);
      const imported=lines.map(line=>{
        const p=line.split(",");
        return {id:Date.now()+Math.random()+"",date:(p[0]||"").trim(),total:parseFloat(p[1])||null,has_excuse:(p[4]||"").trim()==="oui",notes:"",raw:""};
      }).filter(r=>r.date&&r.total);
      mergeSave(imported,document.getElementById("import-feedback"));
    } catch { document.getElementById("import-feedback").innerHTML=`<div class="error-box">❌ Fichier CSV invalide.</div>`; }
  };
  reader.readAsText(file); e.target.value="";
}
function importJSON(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error();
      mergeSave(data,document.getElementById("import-feedback"));
    } catch { document.getElementById("import-feedback").innerHTML=`<div class="error-box">❌ JSON invalide.</div>`; }
  };
  reader.readAsText(file); e.target.value="";
}
function mergeSave(imported,fbEl) {
  const newOnes=imported.filter(i=>!reports.find(r=>r.date===i.date));
  reports=[...reports,...newOnes].sort((a,b)=>a.date.localeCompare(b.date));
  saveReports(reports);
  fbEl.innerHTML=`<div class="success-box">✅ ${newOnes.length} nouveau(x) rapport(s) importé(s). Total: ${reports.length}.</div>`;
}
function dl(name,content,type) {
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name; a.click();
}

// ── INIT ──────────────────────────────────────────────────
showTab("dashboard");
</script>
</body>
</html>
