<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><title>Test Supabase</title></head>
<body style="font-family:sans-serif;padding:20px">
<h2>Test Supabase Connection</h2>
<div id="result" style="padding:15px;background:#f0f0f0;border-radius:8px;margin-top:10px">Testing...</div>
<script>
const URL="https://gvxlydqzgykuqiluklbv.supabase.co";
const KEY="sb_publishable_lrknZdDb6ViGTpFihB59nw_pFrKCVqT";

async function test(){
  const el=document.getElementById("result");
  try{
    el.textContent="Fetching...";
    const res=await fetch(URL+"/rest/v1/rapports?select=date,total&order=date&limit=3",{
      headers:{
        "apikey":KEY,
        "Authorization":"Bearer "+KEY
      }
    });
    el.style.background=res.ok?"#e0ffe0":"#ffe0e0";
    const text=await res.text();
    el.textContent="Status: "+res.status+"\n\n"+text;
  }catch(e){
    el.style.background="#ffe0e0";
    el.textContent="Error: "+e.message;
  }
}
test();
</script>
</body>
</html>
