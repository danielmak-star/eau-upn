<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#1a6b3c"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>Vente d'Eau UPN</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f5f0e8;--card:#fffdf7;--border:#ddd5c0;--text:#1a1208;--muted:#8a7a60;--accent:#1a6b3c;--accent-light:#e8f5ee;--danger:#b83232;--danger-light:#fdf0f0;--gold:#c9881a;--gold-light:#fdf6e8;--blue:#1a5a8a;--blue-light:#e8f0f8;--font:Georgia,serif}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
    .header{background:var(--accent);padding:14px 18px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
    .header-inner{display:flex;justify-content:space-between;align-items:center}
    .header-sub{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.55);text-transform:uppercase;margin-bottom:2px}
    .header-title{font-size:19px;font-weight:700;color:#fff}
    .sync-bar{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px}
    .badge-danger{background:rgba(255,80,80,.2);border:1px solid rgba(255,100,100,.4);border-radius:6px;padding:3px 9px;font-size:11px;color:#ffd0d0}
    .badge-muted{color:rgba(255,255,255,.4);font-size:11px}
    .tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;overflow-x:auto}
    .tab-btn{flex:1;padding:11px 3px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);font-size:10px;font-family:var(--font);cursor:pointer;white-space:nowrap;min-width:0}
    .tab-btn.active{border-bottom-color:var(--accent);color:var(--accent);font-weight:700}
    .content{padding:13px 12px 60px;max-width:700px;margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:11px}
    .card-label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
    .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:11px}
    .kpi{border-radius:10px;padding:11px 10px;border:1px solid var(--border)}
    .kpi-val{font-size:14px;font-weight:700;margin-top:3px;line-height:1.3}
    .kpi-sub{font-size:10px;color:var(--muted);margin-top:1px}
    .chart-wrap{position:relative;height:170px;margin-top:7px}
    .chart-wrap-sm{position:relative;height:130px;margin-top:7px}
    .empty{text-align:center;padding:50px 20px;color:var(--muted)}
    .empty-icon{font-size:44px;margin-bottom:10px}
    .empty-title{font-size:17px;font-weight:700;margin-bottom:5px;color:var(--text)}
    .btn{border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer;width:100%;margin-bottom:9px;transition:opacity .15s}
    .btn:active{opacity:.8}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
    .btn-danger{background:var(--danger-light);border:1px solid var(--danger);color:var(--danger)}
    .btn-gold{background:var(--gold-light);border:1px solid var(--gold);color:var(--gold)}
    .btn-green{background:var(--accent-light);border:1px solid var(--accent);color:var(--accent)}
    .btn-sm{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:4px 10px;font-size:11px;font-family:var(--font);cursor:pointer;width:auto;margin-bottom:0}
    .btn-sm-danger{background:none;border:1px solid var(--danger);border-radius:6px;color:var(--danger);padding:4px 10px;font-size:11px;font-family:var(--font);cursor:pointer;width:auto;margin-bottom:0}
    .form-label{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
    .form-input{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-size:15px;font-family:var(--font);width:100%;outline:none;-webkit-appearance:none;margin-bottom:11px}
    .form-input:focus{border-color:var(--accent)}
    .form-input.big{font-size:28px;font-weight:700;text-align:center;padding:16px;color:var(--accent)}
    .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .fraud-warn{background:#fff8e1;border:2px solid var(--gold);border-radius:10px;padding:12px 14px;margin-bottom:11px}
    .fraud-alert{background:var(--danger-light);border:2px solid var(--danger);border-radius:10px;padding:12px 14px;margin-bottom:11px}
    .confirm-box{background:var(--accent-light);border:2px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:11px}
    .confirm-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
    .confirm-label{color:var(--muted);font-size:12px}
    .confirm-value{font-weight:700;font-size:16px}
    .alert-box{background:var(--danger-light);border:1px solid rgba(184,50,50,.2);border-radius:10px;padding:12px 14px;margin-bottom:11px}
    .alert-title{font-size:10px;letter-spacing:2px;color:var(--danger);text-transform:uppercase;font-weight:700;margin-bottom:8px}
    .flag{font-size:12px;color:var(--danger);margin-left:4px;margin-top:2px}
    .history-item{border-radius:10px;padding:12px 14px;margin-bottom:9px;border:1px solid var(--border);background:var(--card)}
    .history-item.flagged{background:var(--danger-light);border-color:rgba(184,50,50,.3)}
    .history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .history-date{font-size:14px;font-weight:700}
    .history-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
    .stat{font-size:12px}.stat span{color:var(--muted)}
    .error-box{color:var(--danger);font-size:13px;margin-bottom:9px;padding:9px 13px;background:var(--danger-light);border-radius:8px;border:1px solid rgba(184,50,50,.2)}
    .success-box{color:var(--accent);font-size:13px;margin-bottom:9px;padding:9px 13px;background:var(--accent-light);border-radius:8px;border:1px solid rgba(26,107,60,.2)}
    .info-box{background:var(--accent-light);border:1px solid rgba(26,107,60,.2);border-radius:10px;padding:12px 14px;margin-bottom:11px;font-size:13px;line-height:1.6}
    .section-title{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:9px;font-weight:700}
    .divider{height:1px;background:var(--border);margin:13px 0}
    .week-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:7px}
    .week-table th{text-align:left;padding:6px 6px;color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);font-weight:600}
    .week-table td{padding:7px 6px;border-bottom:1px solid var(--border)}
    .week-table tr:last-child td{border-bottom:none}
    .filter-bar{display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap;align-items:center}
    .filter-select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;flex:1;min-width:80px}
    .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
    .toggle-row:last-child{border-bottom:none}
    .toggle{position:relative;width:44px;height:24px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:24px;cursor:pointer;transition:.3s}
    .toggle input:checked+.toggle-slider{background:var(--accent)}
    .toggle-slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
    .toggle input:checked+.toggle-slider:before{transform:translateX(20px)}
    .target-bar{background:var(--border);border-radius:6px;height:8px;overflow:hidden;margin-top:6px}
    .target-fill{height:100%;border-radius:6px;transition:width .5s}
    .lock-screen{position:fixed;inset:0;background:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:30px}
    .lock-icon{font-size:52px;margin-bottom:14px}
    .lock-title{font-size:21px;font-weight:700;color:#fff;margin-bottom:5px}
    .lock-sub{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:26px;text-align:center;line-height:1.5}
    .lock-input{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);border-radius:10px;padding:14px 18px;color:#fff;font-size:18px;font-family:var(--font);width:100%;max-width:280px;outline:none;text-align:center;letter-spacing:4px;margin-bottom:13px}
    .lock-input::placeholder{color:rgba(255,255,255,.4);letter-spacing:1px}
    .lock-btn{background:#fff;color:var(--accent);border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;font-family:var(--font);width:100%;max-width:280px;cursor:pointer}
    .lock-error{color:#ffd0d0;font-size:13px;margin-top:10px;text-align:center}
    .pagination{display:flex;gap:7px;justify-content:center;margin-top:11px;flex-wrap:wrap}
    .page-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 13px;font-size:13px;font-family:var(--font);cursor:pointer;color:var(--text)}
    .page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .month-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .month-box{border-radius:8px;padding:10px 12px;border:1px solid var(--border);background:var(--bg)}
    .trend-up{color:#1a6b3c;font-size:12px;font-weight:700}
    .trend-down{color:var(--danger);font-size:12px;font-weight:700}
  </style>
</head>
<body>

<!-- LOCK -->
<div class="lock-screen" id="lock-screen">
  <div class="lock-icon">💧</div>
  <div class="lock-title">Vente d'Eau UPN</div>
  <div class="lock-sub">Entrez votre code d'accès<br>pour continuer</div>
  <input class="lock-input" type="password" id="lock-input" placeholder="Code" onkeydown="if(event.key==='Enter')doUnlock()"/>
  <button class="lock-btn" onclick="doUnlock()">Entrer →</button>
  <div class="lock-error" id="lock-error"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="header-sub">Forage — DRC</div>
        <div class="header-title">💧 Vente d'Eau UPN</div>
        <div class="sync-bar" id="sync-status"></div>
      </div>
      <div id="header-right"></div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('dashboard')">📊 Tableau</button>
    <button class="tab-btn" onclick="showTab('weekly')">📅 Semaines</button>
    <button class="tab-btn" onclick="showTab('add')">＋ Vente</button>
    <button class="tab-btn" onclick="showTab('history')">📋 Historique</button>
    <button class="tab-btn" id="tab-settings-btn" onclick="showTab('settings')">⚙️ Réglages</button>
  </div>
  <div class="content" id="main-content"></div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycby5_XZQGSoxprdMn-uyOsWEHzDm8CjP95eYhF1O-US9XeFOpkpjQo3xlzGLM9nSWzGpcg/exec";
const KEY_S="eau-upn-s3",KEY_C="eau-upn-c3";

let reports=[],currentTab="dashboard",currentPage=1,chartRev=null,chartDow=null;
const _now=new Date();
const _curYear=String(_now.getFullYear());
const _curMonth=String(_now.getMonth()+1).padStart(2,"0");
let S=Object.assign({pricePerJerry:200,jerryLitres:25,usdRate:0,accessCode:"1234",adminPin:"9999",dailyTarget:0,isAdmin:false,pageSize:30,filterYear:_curYear,filterMonth:_curMonth,alertsOn:true,alertFraud:true,alertLow:true,alertMissing:true},loadS());

function loadS(){try{return JSON.parse(localStorage.getItem(KEY_S)||"{}");}catch{return{};}}
function saveS(){try{localStorage.setItem(KEY_S,JSON.stringify(S));}catch{}}
function loadCache(){try{return JSON.parse(localStorage.getItem(KEY_C)||"[]");}catch{return[];}}
function saveCache(d){try{localStorage.setItem(KEY_C,JSON.stringify(d));}catch{}}

// ── LOCK ──────────────────────────────────────────────────
function doUnlock(){
  const v=document.getElementById("lock-input").value.trim();
  const err=document.getElementById("lock-error");
  if(v===S.adminPin){S.isAdmin=true;saveS();unlock();}
  else if(v===S.accessCode){S.isAdmin=false;saveS();unlock();}
  else{err.textContent="Code incorrect. Réessayez.";document.getElementById("lock-input").value="";}
}
function unlock(){
  document.getElementById("lock-screen").style.display="none";
  document.getElementById("app").style.display="block";
  // Hide settings tab for non-admin
  const settingsBtn=document.getElementById("tab-settings-btn");
  if(settingsBtn) settingsBtn.style.display=S.isAdmin?"":"none";
  loadData();
  setInterval(()=>{ setSS("Actualisation..."); loadData(); }, 5*60*1000);
}

// ── SYNC ──────────────────────────────────────────────────
function setSS(msg,c){const el=document.getElementById("sync-status");if(el){el.textContent=msg;el.style.color=c||"rgba(255,255,255,.6)";}}
async function loadData(){
  reports=loadCache();if(reports.length)renderCurrent();
  setSS("Synchronisation...");
  try{
    const res=await fetch(SCRIPT_URL+"?t="+Date.now());
    const j=await res.json();
    if(j.ok&&j.data?.reports){
      reports=j.data.reports.map(r=>{
        // Handle various date formats from Google Sheets
        let d=String(r.date||"");
        if(d.length>10){
          // Full timestamp — parse and reformat
          const dt=new Date(d);
          if(!isNaN(dt)){
            d=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
          } else {
            d=d.slice(0,10);
          }
        }
        return {...r,date:d,total:Number(r.total),jerry_cans:Number(r.jerry_cans||0),fraud_flag:r.fraud_flag===true||r.fraud_flag==="TRUE",has_excuse:r.has_excuse===true||r.has_excuse==="TRUE"};
      }).filter(r=>r.date&&/^20\d{2}-\d{2}-\d{2}$/.test(r.date)&&r.total).sort((a,b)=>a.date.localeCompare(b.date));
      if(j.data.settings){const rs=j.data.settings;S.alertsOn=rs.alerts_on;S.alertFraud=rs.alert_types?.fraud;S.alertLow=rs.alert_types?.low;S.alertMissing=rs.alert_types?.missing;saveS();}
      saveCache(reports);setSS("✓ Synchronisé","rgba(255,255,255,.75)");renderCurrent();
    }
  }catch{setSS("Hors ligne","rgba(255,200,100,.8)");}
}
async function syncAdd(entry){
  const avg=reports.length?Math.round(reports.filter(r=>r.total).reduce((s,r)=>s+r.total,0)/reports.filter(r=>r.total).length):0;
  const low_flag=avg>0&&entry.total<avg*0.65;
  try{
    const res=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"add",...entry,avg_fc:avg,low_flag})});
    const j=await res.json();return j.ok;
  }catch{return false;}
}
async function syncDelete(date){
  try{const res=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"delete",date,pin:S.adminPin})});const j=await res.json();return j.ok;}catch{return false;}
}
async function pushAlertSettings(){
  try{await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"settings",pin:S.adminPin,alerts_on:S.alertsOn,alert_types:{fraud:S.alertFraud,low:S.alertLow,missing:S.alertMissing}})});}catch{}
}

// ── HELPERS ───────────────────────────────────────────────
const fmtFC=n=>n==null?"—":Number(n).toLocaleString("fr-FR")+" FC";
const fmtL=n=>n==null?"—":Number(n).toLocaleString("fr-FR")+" L";
const fmtUSD=n=>(!n||!S.usdRate)?"—":"$"+(n/S.usdRate).toFixed(2);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{
  if(!d) return "—";
  try{
    // Always parse as YYYY-MM-DD to avoid timezone issues
    const s=String(d).slice(0,10);
    const parts=s.split("-");
    if(parts.length===3){
      const dt=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
      return dt.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
    }
    return s;
  }catch{return String(d).slice(0,10);}
};
const DAYS=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const litres=fc=>(!fc||!S.pricePerJerry)?0:Math.round((fc/S.pricePerJerry)*S.jerryLitres);
const expectedFC=jerry=>jerry*S.pricePerJerry;

function filtered(){
  return reports.filter(r=>{
    if(S.filterYear!=="all"&&!r.date.startsWith(S.filterYear))return false;
    if(S.filterMonth!=="all"&&r.date.slice(5,7)!==S.filterMonth)return false;
    return true;
  });
}
function getYears(){
  return [...new Set(reports.map(r=>r.date).filter(d=>d&&d.match(/^\d{4}-\d{2}-\d{2}$/)).map(d=>d.slice(0,4)))].filter(y=>y.match(/^20\d{2}$/)).sort().reverse();
}
let _filterCb="";
function onYearChange(v){S.filterYear=v;saveS();currentPage=1;eval(_filterCb);}
function onMonthChange(v){S.filterMonth=v;saveS();currentPage=1;eval(_filterCb);}
function filterBar(cb){
  _filterCb=cb;
  const years=[...new Set([...getYears(),"2026","2027"])].filter(y=>/^20\d{2}$/.test(y)).sort().reverse();
  const yOpts=years.map(y=>`<option value="${y}" ${S.filterYear===y?"selected":""}>${y}</option>`).join("");
  const mNames=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const mOpts=mNames.map((l,i)=>{const v=String(i+1).padStart(2,"0");return`<option value="${v}" ${S.filterMonth===v?"selected":""}>${l}</option>`;}).join("");
  return`<div class="filter-bar">
    <select class="filter-select" onchange="onYearChange(this.value)">${yOpts}<option value="all" ${S.filterYear==="all"?"selected":""}>Tout</option></select>
    <select class="filter-select" onchange="onMonthChange(this.value)">${mOpts}<option value="all" ${S.filterMonth==="all"?"selected":""}>Tout</option></select>
  </div>`;
}

// ── ANOMALY ───────────────────────────────────────────────
function anomalies(reps){
  const flags={};

  if(reps.length>=4){
    const t=reps.filter(r=>r.total).map(r=>r.total);
    const mean=t.reduce((a,b)=>a+b,0)/t.length;
    const std=Math.sqrt(t.map(x=>(x-mean)**2).reduce((a,b)=>a+b,0)/t.length);

    // Statistical: too low or too high
    reps.forEach(r=>{
      if(r.total<mean-1.8*std){flags[r.date]=flags[r.date]||[];flags[r.date].push("📉 Ventes nettement en dessous de la moyenne");}
      if(r.total>mean+1.8*std){flags[r.date]=flags[r.date]||[];flags[r.date].push("📈 Ventes inhabituellement élevées");}
    });

    // Below daily target
    if(S.dailyTarget>0){
      reps.forEach(r=>{
        if(r.total<S.dailyTarget){flags[r.date]=flags[r.date]||[];flags[r.date].push(`🎯 En dessous de l'objectif (${fmtFC(S.dailyTarget)})`);}
      });
    }

    // Same amount 3+ consecutive days
    for(let i=2;i<reps.length;i++){
      if(reps[i].total===reps[i-1].total&&reps[i].total===reps[i-2].total){
        flags[reps[i].date]=flags[reps[i].date]||[];
        flags[reps[i].date].push("🔁 Même montant 3 jours de suite — vérifiez");
      }
    }

    // Consecutive low days (3+)
    let streak=0;
    [...reps].forEach(r=>{
      if(r.total<mean*0.65){streak++;}else{streak=0;}
      if(streak>=3){flags[r.date]=flags[r.date]||[];flags[r.date].push(`📉 ${streak} jours consécutifs très bas`);}
    });

    // Sudden drop: current week avg < 60% of previous week avg
    const weeks=byWeek(reps);
    if(weeks.length>=2){
      const last=weeks[weeks.length-1];
      const prev=weeks[weeks.length-2];
      const lastAvg=last.total/last.days;
      const prevAvg=prev.total/prev.days;
      if(lastAvg<prevAvg*0.6){
        // Flag all days in last week
        reps.filter(r=>r.date>=last.weekStart).forEach(r=>{
          flags[r.date]=flags[r.date]||[];
          if(!flags[r.date].find(f=>f.includes("chute")))
            flags[r.date].push("⬇️ Chute soudaine vs semaine précédente");
        });
      }
    }
  }
  return flags;
}

// ── WEEKLY ────────────────────────────────────────────────
function byWeek(reps){
  const w={};
  reps.forEach(r=>{
    if(!r.date||!r.total)return;
    const d=new Date(r.date),day=d.getDay(),mon=new Date(d);
    mon.setDate(d.getDate()-(day===0?6:day-1));
    const k=mon.toISOString().slice(0,10);
    w[k]=w[k]||{weekStart:k,total:0,days:0,litresTotal:0,fraudDays:0};
    w[k].total+=r.total;w[k].days+=1;w[k].litresTotal+=litres(r.total);
    if(r.fraud_flag)w[k].fraudDays+=1;
  });
  return Object.values(w).sort((a,b)=>a.weekStart.localeCompare(b.weekStart));
}

// ── CHARTS ────────────────────────────────────────────────
function destroyCharts(){if(chartRev){chartRev.destroy();chartRev=null;}if(chartDow){chartDow.destroy();chartDow=null;}}
function buildCharts(reps){
  const last60=reps.slice(-60).map(r=>({...r,date:String(r.date||"").slice(0,10)}));
  const c1=document.getElementById("chartRevenue");
  if(c1&&last60.length){
    const target=S.dailyTarget;
    const ds=[{label:"FC",data:last60.map(r=>r.total),borderColor:"#1a6b3c",backgroundColor:"rgba(26,107,60,.1)",borderWidth:2,pointRadius:2,fill:true,tension:0.3}];
    if(target>0)ds.push({label:"Objectif",data:last60.map(()=>target),borderColor:"#c9881a",borderWidth:1,borderDash:[4,4],pointRadius:0,fill:false});
    chartRev=new Chart(c1,{type:"line",data:{labels:last60.map(r=>r.date.slice(5)),datasets:ds},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:target>0,labels:{font:{size:10}}}},
        scales:{x:{grid:{color:"#ddd5c0"},ticks:{font:{size:9},maxRotation:45}},y:{grid:{color:"#ddd5c0"},ticks:{font:{size:9},callback:v=>`${(v/1000).toFixed(0)}k`}}}}});
  }
  const dm={};reps.forEach(r=>{if(!r.total||!r.date)return;const d=new Date(r.date).getDay();dm[d]=dm[d]||[];dm[d].push(r.total);});
  const c2=document.getElementById("chartDow");
  if(c2){chartDow=new Chart(c2,{type:"bar",data:{labels:DAYS,datasets:[{data:DAYS.map((_,i)=>dm[i]?Math.round(dm[i].reduce((a,b)=>a+b,0)/dm[i].length):0),backgroundColor:"#c9881a",borderRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:"#ddd5c0"},ticks:{font:{size:9},callback:v=>`${(v/1000).toFixed(0)}k`}}}}});}
}

// ── RENDER ────────────────────────────────────────────────
function renderCurrent(){const el=document.getElementById("main-content");if(!el)return;({dashboard:renderDashboard,weekly:renderWeekly,add:renderAdd,history:renderHistory,settings:renderSettings})[currentTab]?.(el);}
function showTab(n){
  if(n==="settings"&&!S.isAdmin){
    alert("Accès réservé à l'administrateur.");return;
  }
  destroyCharts();currentTab=n;currentPage=1;
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active",["dashboard","weekly","add","history","settings"][i]===n));
  renderCurrent();
}

// ── DASHBOARD ─────────────────────────────────────────────
function renderDashboard(el){
  const reps=filtered();
  const fl=anomalies(reps);
  const flagCount=Object.keys(fl).length;
  document.getElementById("header-right").innerHTML=flagCount>0?`<span class="badge-danger">${flagCount} alerte${flagCount>1?"s":""}</span>`:`<span class="badge-muted">${reports.length} rapports</span>`;
  if(!reports.length){el.innerHTML=`<div class="empty"><div class="empty-icon">💧</div><div class="empty-title">Aucun rapport</div><p style="margin-bottom:18px;font-size:14px">Commencez par ajouter une vente</p><button class="btn btn-primary" style="width:auto;padding:11px 22px" onclick="showTab('add')">＋ Ajouter</button></div>`;return;}

  const totalFC=reps.reduce((s,r)=>s+(r.total||0),0);
  const totalL=reps.reduce((s,r)=>s+(litres(r.total)||0),0);
  const withT=reps.filter(r=>r.total);
  const avgFC=withT.length?Math.round(withT.reduce((s,r)=>s+r.total,0)/withT.length):0;
  const best=reps.reduce((b,r)=>r.total>(b?.total||0)?r:b,null);
  const weeks=byWeek(reps);
  const avgWFC=weeks.length?Math.round(weeks.reduce((s,w)=>s+w.total,0)/weeks.length):0;
  const avgWL=weeks.length?Math.round(weeks.reduce((s,w)=>s+w.litresTotal,0)/weeks.length):0;

  // Month compare
  const _n=new Date();
  const curM=_n.getFullYear()+"-"+String(_n.getMonth()+1).padStart(2,"0");
  const _p=new Date(_n.getFullYear(),_n.getMonth()-1,1);
  const prevM=_p.getFullYear()+"-"+String(_p.getMonth()+1).padStart(2,"0");
  const curMTotal=reports.filter(r=>String(r.date).slice(0,7)===curM).reduce((s,r)=>s+(r.total||0),0);
  const prevMTotal=reports.filter(r=>String(r.date).slice(0,7)===prevM).reduce((s,r)=>s+(r.total||0),0);
  const mDiff=prevMTotal>0?Math.round(((curMTotal-prevMTotal)/prevMTotal)*100):null;

  // Target
  const targetHTML=S.dailyTarget>0?`
    <div style="margin-top:8px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px">
        <span>Objectif: ${fmtFC(S.dailyTarget)}/jour</span>
        <span>${avgFC>=S.dailyTarget?"✅ Atteint":"⚠️ "+(Math.round((avgFC/S.dailyTarget)*100))+"%"}</span>
      </div>
      <div class="target-bar"><div class="target-fill" style="width:${Math.min(100,Math.round((avgFC/S.dailyTarget)*100))}%;background:${avgFC>=S.dailyTarget?"var(--accent)":"var(--gold)"}"></div></div>
    </div>`:"";

  // Monthly running total
  const monthlyHTML=`<div class="card" style="background:var(--blue-light);border-color:var(--blue)">
    <div class="card-label" style="color:var(--blue)">Ce mois (${curM})</div>
    <div style="font-size:18px;font-weight:700;color:var(--blue)">${fmtFC(curMTotal)}</div>
    ${prevMTotal>0?`<div class="month-compare">
      <div class="month-box"><div style="font-size:10px;color:var(--muted)">Mois précédent</div><div style="font-weight:700;font-size:13px">${fmtFC(prevMTotal)}</div></div>
      <div class="month-box"><div style="font-size:10px;color:var(--muted)">Évolution</div><div class="${mDiff>=0?"trend-up":"trend-down"}">${mDiff>=0?"▲":"▼"} ${Math.abs(mDiff)}%</div></div>
    </div>`:""}
  </div>`;

  let alertHTML="";
  if(flagCount>0){
    const items=Object.entries(fl).map(([date,flags])=>{
      const r=reps.find(x=>x.date===date);
      return`<div style="margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid rgba(184,50,50,.1)"><div style="font-size:12px;font-weight:700;margin-bottom:3px">${fmtDate(date)} — ${fmtFC(r?.total)}</div>${flags.map(f=>`<div class="flag">${f}</div>`).join("")}</div>`;
    }).join("");
    alertHTML=`<div class="alert-box"><div class="alert-title">🚨 Alertes (${flagCount})</div>${items}</div>`;
  }

  el.innerHTML=`
    ${filterBar("renderDashboard(document.getElementById('main-content'))")}
    <div class="kpi-grid">
      <div class="kpi" style="background:var(--accent-light)"><div class="card-label">Revenu total</div><div class="kpi-val" style="color:var(--accent)">${fmtFC(totalFC)}</div>${S.usdRate?`<div class="kpi-sub">${fmtUSD(totalFC)}</div>`:""}</div>

      <div class="kpi" style="background:var(--blue-light)"><div class="card-label">Total litres</div><div class="kpi-val" style="color:var(--blue)">${fmtL(totalL)}</div></div>
      <div class="kpi" style="background:var(--gold-light)"><div class="card-label">Moy. / jour</div><div class="kpi-val" style="color:var(--gold)">${fmtFC(avgFC)}</div>${targetHTML}</div>
      <div class="kpi" style="background:var(--card)"><div class="card-label">Meilleur jour</div><div class="kpi-val" style="font-size:12px">${fmtFC(best?.total)}<br><span style="font-size:10px;color:var(--muted);font-weight:400">${fmtDate(best?.date||"")}</span></div></div>
    </div>
    <div class="card" style="background:var(--gold-light);border-color:var(--gold)">
      <div class="card-label" style="color:var(--gold)">Moyenne hebdomadaire</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:3px">
        <div><div style="font-size:16px;font-weight:700;color:var(--gold)">${fmtFC(avgWFC)}</div><div style="font-size:10px;color:var(--muted)">/ semaine</div></div>

        ${S.usdRate?`<div><div style="font-size:16px;font-weight:700;color:var(--accent)">${fmtUSD(avgWFC)}</div><div style="font-size:10px;color:var(--muted)">/ semaine</div></div>`:""}
      </div>
    </div>
    ${monthlyHTML}
    ${S.usdRate?`<div class="card" style="background:var(--gold-light);border-color:var(--gold)">
      <div class="card-label" style="color:var(--gold)">Conversion USD (1 USD = ${Number(S.usdRate).toLocaleString("fr-FR")} FC)</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px">
        <div><div style="font-size:11px;color:var(--muted)">Total</div><div style="font-weight:700;font-size:15px;color:var(--gold)">${fmtUSD(totalFC)}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">Moy./jour</div><div style="font-weight:700;font-size:15px;color:var(--gold)">${fmtUSD(avgFC)}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">Moy./sem.</div><div style="font-weight:700;font-size:15px;color:var(--gold)">${fmtUSD(avgWFC)}</div></div>
      </div>
    </div>`:""}
    <div class="card"><div class="card-label">Ventes journalières</div><div class="chart-wrap"><canvas id="chartRevenue"></canvas></div></div>
    <div class="card"><div class="card-label">Moyenne par jour de la semaine</div><div class="chart-wrap-sm"><canvas id="chartDow"></canvas></div></div>
    ${alertHTML}`;
  setTimeout(()=>buildCharts(reps),50);
}

// ── WEEKLY ────────────────────────────────────────────────
function renderWeekly(el){
  const reps=filtered();
  if(!reps.length){el.innerHTML=`<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">Aucune donnée</div></div>`;return;}
  const weeks=byWeek(reps).reverse();
  const avgWFC=weeks.length?Math.round(weeks.reduce((s,w)=>s+w.total,0)/weeks.length):0;
  const rows=weeks.map(w=>{
    const flag=w.total<avgWFC*.7?"📉":w.total>avgWFC*1.3?"📈":"";
    const fraud=w.fraudDays>0?`<span style="color:var(--danger);font-size:11px"> 🚨${w.fraudDays}j</span>`:"";
    return`<tr><td style="font-weight:700;font-size:11px">${fmtDate(w.weekStart)}</td><td>${w.days}j</td><td style="color:var(--accent);font-weight:700">${fmtFC(w.total)}</td><td style="color:var(--muted);font-size:11px">${S.usdRate?fmtUSD(w.total):""}</td><td>${flag}${fraud}</td></tr>`;
  }).join("");
  el.innerHTML=`
    ${filterBar("renderWeekly(document.getElementById('main-content'))")}
    <div class="card" style="background:var(--gold-light);border-color:var(--gold)"><div class="card-label" style="color:var(--gold)">Moyenne hebdomadaire</div><div style="font-size:18px;font-weight:700;color:var(--gold)">${fmtFC(avgWFC)}</div></div>
    <div class="card" style="overflow-x:auto"><div class="section-title">Toutes les semaines</div><table class="week-table"><thead><tr><th>Semaine</th><th>Jours</th><th>Total FC</th><th>USD</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderAdd(el){
  el.innerHTML=`
    <div class="card">
      <div class="section-title">Nouvelle vente</div>
      <label class="form-label">Date</label>
      <input type="date" id="inp-date" class="form-input" value="${today()}"/>

      <div id="add-feedback"></div>

function updateSaveBtn(){
  const fc=parseInt(document.getElementById("inp-fc").value)||0;
  const btn=document.getElementById("btn-save");
  if(btn) btn.disabled=fc<=0;
  // Hide confirm box when amount changes
  const conf=document.getElementById("confirm-box");
  if(conf) conf.style.display="none";
  const btnConf=document.getElementById("btn-confirm");
  if(btnConf) btnConf.style.display="none";
  if(btn) btn.style.display="";
}

function showConfirm(){
  const date=document.getElementById("inp-date").value;
  const fc=parseInt(document.getElementById("inp-fc").value)||0;
  const notes=document.getElementById("inp-notes").value.trim();
  if(!fc||!date) return;
  const equiv=Math.round((fc/200)*25);
  document.getElementById("confirm-box").innerHTML=`
    <div class="confirm-box">
      <div style="font-size:13px;font-weight:700;color:var(--danger);margin-bottom:10px">
        ⚠️ Vérifiez bien — impossible de modifier après enregistrement
      </div>
      <div class="confirm-row"><span class="confirm-label">Date</span><span class="confirm-value">${fmtDate(date)}</span></div>
      <div class="confirm-row"><span class="confirm-label">Montant encaissé</span><span class="confirm-value" style="color:var(--accent)">${fmtFC(fc)}</span></div>
      <div class="confirm-row"><span class="confirm-label">Équivalent litres</span><span class="confirm-value" style="color:var(--blue)">${equiv.toLocaleString("fr-FR")} L</span></div>
      ${notes?`<div class="confirm-row"><span class="confirm-label">Notes</span><span class="confirm-value" style="font-size:13px">${notes}</span></div>`:""}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
        <button class="btn" style="background:var(--border);color:var(--text);margin:0" onclick="cancelConfirm()">✏️ Corriger</button>
        <button class="btn btn-primary" style="margin:0" onclick="doSave()">✅ Confirmer</button>
      </div>
    </div>`;
  document.getElementById("confirm-box").style.display="block";
  document.getElementById("btn-save").style.display="none";
}

function cancelConfirm(){
  document.getElementById("confirm-box").style.display="none";
  document.getElementById("btn-save").style.display="";
}

function updateCalc(){
  const jerry=parseInt(document.getElementById("inp-jerry").value)||0;
  const fc=parseInt(document.getElementById("inp-fc").value)||0;
  const expected=Math.round((jerry/S.jerryLitres)*S.pricePerJerry);
  const fb=document.getElementById("calc-feedback");
  const confirmArea=document.getElementById("confirm-area");
  const btn=document.getElementById("btn-save");
  addState={jerry,fc,confirmed:false};

  if(jerry>0&&fc>0){
    const diff=fc-expected;
    const pct=Math.abs(diff/expected)*100;
    if(Math.abs(diff)>0&&pct>5){
      const isFraud=diff<0;
      fb.innerHTML=`<div class="${isFraud?"fraud-alert":"fraud-warn"}">
        <div style="font-weight:700;font-size:14px;margin-bottom:6px">${isFraud?"🚨 Alerte fraude possible":"⚠️ Vérification requise"}</div>
        <div style="font-size:13px;line-height:1.7">
          Litres: <strong>${jerry}</strong>L ÷ ${S.jerryLitres}L × ${fmtFC(S.pricePerJerry)} = <strong>${fmtFC(expected)}</strong><br>
          Montant déclaré: <strong>${fmtFC(fc)}</strong><br>
          Écart: <strong style="color:${isFraud?"var(--danger)":"var(--gold)"}">${diff>0?"+":""}${fmtFC(diff)}</strong>
        </div>
      </div>`;
    } else {
      fb.innerHTML=`<div class="success-box">✅ ${fmtL(jerry)} ÷ ${S.jerryLitres}L × ${fmtFC(S.pricePerJerry)} = ${fmtFC(expected)} — Montant correct</div>`;
    }
    // Confirmation screen
    confirmArea.innerHTML=`<div class="confirm-box">
      <div style="font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:10px;font-weight:700">Confirmer avant d'enregistrer</div>
      <div class="confirm-row"><span class="confirm-label">Date</span><span class="confirm-value">${fmtDate(document.getElementById("inp-date").value)}</span></div>
      <div class="confirm-row"><span class="confirm-label">Litres vendus</span><span class="confirm-value" style="color:var(--blue)">${fmtL(jerry)}</span></div>
      
      <div class="confirm-row"><span class="confirm-label">Montant FC</span><span class="confirm-value" style="color:var(--accent)">${fmtFC(fc)}</span></div>
      ${S.usdRate?`<div class="confirm-row"><span class="confirm-label">Montant USD</span><span class="confirm-value" style="color:var(--gold)">${fmtUSD(fc)}</span></div>`:""}
    </div>`;
    btn.disabled=false;
  } else {
    fb.innerHTML="";confirmArea.innerHTML="";btn.disabled=true;
  }
}

async function doSave(){
  const date=document.getElementById("inp-date").value;
  const fc=parseInt(document.getElementById("inp-fc").value)||0;
  const notes=document.getElementById("inp-notes").value.trim();
  const fb=document.getElementById("add-feedback");
  const btn=document.getElementById("btn-save");
  if(!fc||!date)return;
  const entry={date,total:fc,jerry_cans:0,litres_sold:0,expected_fc:0,fraud_flag:false,has_excuse:false,notes,staff:"staff"};
  btn.disabled=true;btn.textContent="Enregistrement...";
  const idx=reports.findIndex(r=>r.date===date);
  if(idx>=0)reports[idx]={...reports[idx],...entry};else reports.push(entry);
  reports.sort((a,b)=>a.date.localeCompare(b.date));saveCache(reports);
  const ok=await syncAdd(entry);
  fb.innerHTML=ok
    ?`<div class="success-box">✅ ${fmtFC(fc)} enregistré pour le ${fmtDate(date)}</div>`
    :`<div class="error-box">⚠️ Sauvegarde locale OK — sync échouée. Réessayez.</div>`;
  document.getElementById("inp-fc").value="";
  document.getElementById("inp-notes").value="";
  btn.disabled=true;btn.textContent="💾 Enregistrer";
  if(ok){
    await loadData();
    setTimeout(()=>showTab("dashboard"),800);
  }
}

// ── HISTORY ───────────────────────────────────────────────
function renderHistory(el){
  const reps=filtered();
  if(!reports.length){el.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Aucun rapport</div></div>`;return;}
  const fl=anomalies(reps);
  const total=reps.length,pages=Math.ceil(total/S.pageSize);
  currentPage=Math.min(currentPage,pages||1);
  const start=(currentPage-1)*S.pageSize;
  const pageReps=[...reps].reverse().slice(start,start+S.pageSize);
  const items=pageReps.map(r=>{
    const flagged=!!fl[r.date];
    const l=litres(r.total);
    const delBtn=S.isAdmin?`<button class="btn-sm-danger" onclick="doDelete('${r.date}')">🗑 Supprimer</button>`:"";
    return`<div class="history-item ${flagged?"flagged":""}">
      <div class="history-header"><div><span class="history-date">${fmtDate(r.date)}</span>${r.fraud_flag?`<span style="font-size:11px;color:var(--danger);margin-left:6px">🚨</span>`:""}${r.has_excuse?`<span style="font-size:11px;color:var(--gold);margin-left:5px">💬</span>`:""}</div>${delBtn}</div>
      <div class="history-stats">
        <div class="stat"><span>FC: </span><strong style="color:var(--accent)">${fmtFC(r.total)}</strong></div>
        <div class="stat"><span>Litres: </span><strong style="color:var(--blue)">${fmtL(r.jerry_cans||r.litres_sold)}</strong></div>

        ${S.usdRate?`<div class="stat"><span>$: </span><strong style="color:var(--gold)">${fmtUSD(r.total)}</strong></div>`:""}
      </div>
      ${flagged?fl[r.date].map(f=>`<div class="flag">${f}</div>`).join(""):""}
      ${r.notes?`<div style="font-size:11px;color:var(--muted);margin-top:4px;font-style:italic">${r.notes}</div>`:""}
    </div>`;
  }).join("");
  let pag="";
  if(pages>1){const btns=Array.from({length:pages},(_,i)=>`<button class="page-btn ${i+1===currentPage?"active":""}" onclick="currentPage=${i+1};renderHistory(document.getElementById('main-content'))">${i+1}</button>`).join("");pag=`<div class="pagination">${btns}</div>`;}
  el.innerHTML=`
    ${filterBar("renderHistory(document.getElementById('main-content'))")}

    ${items}${pag}`;
}

async function doDelete(date){
  if(!S.isAdmin){alert("Accès refusé.");return;}
  if(!confirm("Supprimer le rapport du "+fmtDate(date)+" ?\n\nCette action supprimera aussi la donnée dans Google Sheets."))return;
  const el=document.getElementById("main-content");
  el.innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted)">Suppression en cours...</div>`;
  const ok=await syncDelete(date);
  if(ok){
    reports=reports.filter(r=>r.date!==date);
    saveCache(reports);
    // Reload from server to confirm
    await loadData();
    renderHistory(document.getElementById("main-content"));
  } else {
    alert("Erreur lors de la suppression. Vérifiez votre connexion.");
    renderHistory(document.getElementById("main-content"));
  }
}

      <div class="section-title">Accès & sécurité</div>
      <label class="form-label">Code d'accès staff</label>
      <input type="text" id="s-access" class="form-input" value="${S.accessCode}" placeholder="Code pour ouvrir l'app"/>
      <p style="font-size:11px;color:var(--muted);margin-bottom:11px">Changez pour bloquer d'anciens membres</p>
      ${S.isAdmin?`<label class="form-label">PIN administrateur</label><input type="password" id="s-admin" class="form-input" value="${S.adminPin}"/>`:""}
    </div>

    <div id="settings-feedback"></div>
    <button class="btn btn-primary" onclick="doSaveSettings()">✅ Enregistrer</button>
    <button class="btn btn-gold" onclick="exportCSV()" ${!reports.length?"disabled":""}>⬇️ Exporter CSV</button>
    <button class="btn btn-green" onclick="loadData()">🔄 Synchroniser</button>
    ${S.isAdmin?`<button class="btn btn-danger" onclick="doLogout()" style="margin-top:2px">🔒 Déconnexion admin</button>`:""}
  `;
}

function onToggle(id,val){
  const map={tn_alerts:"alertsOn","t-alerts":"alertsOn","t-fraud":"alertFraud","t-low":"alertLow","t-missing":"alertMissing"};
  const key=map[id];if(key){S[key]=val;saveS();if(S.isAdmin)pushAlertSettings();}
}

function doSaveSettings(){
  const price=parseFloat(document.getElementById("s-price").value);
  const litresV=parseFloat(document.getElementById("s-litres").value);
  const rate=parseFloat(document.getElementById("s-rate").value)||0;
  const target=parseFloat(document.getElementById("s-target").value)||0;
  const access=document.getElementById("s-access").value.trim();
  const adminEl=document.getElementById("s-admin");
  const admin=adminEl?adminEl.value.trim():S.adminPin;
  if(!price||!litresV||!access){document.getElementById("settings-feedback").innerHTML=`<div class="error-box">Champs requis manquants.</div>`;return;}
  S=Object.assign(S,{pricePerJerry:price,jerryLitres:litresV,usdRate:rate,dailyTarget:target,accessCode:access,adminPin:admin});
  saveS();if(S.isAdmin)pushAlertSettings();
  document.getElementById("settings-feedback").innerHTML=`<div class="success-box">✅ Paramètres enregistrés.</div>`;
  setTimeout(()=>showTab("dashboard"),1000);
}

function doLogout(){S.isAdmin=false;saveS();location.reload();}

function exportCSV(){
  const h="date,total_FC,jerry_cans,litres,usd,fraud,excuse,notes";
  const rows=reports.map(r=>`${r.date},${r.total},${r.jerry_cans||0},${litres(r.total)},${S.usdRate?(r.total/S.usdRate).toFixed(2):""},${r.fraud_flag?"oui":"non"},${r.has_excuse?"oui":"non"},"${(r.notes||"").replace(/"/g,'""')}"`);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([[h,...rows].join("\n")],{type:"text/csv"}));a.download="eau-upn-"+today()+".csv";a.click();
}
</script>
</body>
</html>
